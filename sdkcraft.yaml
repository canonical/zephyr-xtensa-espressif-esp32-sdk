name: zephyr-xtensa-espressif-esp32
base: ubuntu@24.04
adopt-info: toolchain
summary: Zephyr Toolchain
description: |
  This SDK provides the Xtensa cross-compiler toolchain for building Zephyr
  firmware targeting the xtensa-espressif_esp32_zephyr-elf target triple.
  Use this SDK alongside the zephyr base SDK.
license: Apache-2.0
platforms:
  amd64:

slots:
  toolchain:
    interface: mount
    workshop-source: $SDK
parts:
  toolchain:
    plugin: dump
    source: https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v$CRAFT_PROJECT_VERSION/toolchain_linux-x86_64_xtensa-espressif_esp32_zephyr-elf.tar.xz
    source-type: tar
    override-pull: |
      VERSION=$(cat "$CRAFT_PROJECT_DIR/VERSION")
      craftctl set version="$VERSION"
      craftctl default
